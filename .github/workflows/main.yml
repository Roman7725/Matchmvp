name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Запускаем сборку прямо через системный Gradle в папке MatchMVP
    - name: Build with Gradle
      working-directory: ./MatchMVP
      run: gradle assembleDebug --stacktrace
