name: Build Release AAB and APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    # Переходим в папку MatchMVP и даем права файлу gradlew
    - name: Grant execute permission for gradlew
      run: |
        cd MatchMVP
        chmod +x gradlew

    # Декодируем секрет и сохраняем его в MatchMVP/app/release.jks
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > MatchMVP/app/release.jks

    # Собираем и AAB (для Google Play), и APK (для установки на телефон)
    - name: Build Release Bundle (AAB) and APK
      run: |
        cd MatchMVP
        ./gradlew bundleRelease assembleRelease -x lintVitalRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    # AAB для Google Play
    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: MatchMVP/app/build/outputs/bundle/release/app-release.aab

    # APK для установки на телефон
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: MatchMVP/app/build/outputs/apk/release/*.apk
